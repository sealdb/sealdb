name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      # Temporarily skipped while TDD itest corpus + runner land; re-enable per job.
      - name: fmt
        if: false
        run: cargo fmt --all --check
      - name: clippy
        if: false
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        if: false
        run: cargo test --workspace
      - name: SELECT 1
        run: cargo run -p sealdb-server-bin -- --execute "SELECT 1"
      - name: integrationtest green+local
        if: false
        # Manifest gate: only green + local (never pending / in_progress / deferred).
        run: ./tests/integrationtest/run-tests.sh -s memory

  oracle-smoke:
    runs-on: ubuntu-latest
    if: false
    steps:
      - uses: actions/checkout@v4
      - name: placeholder
        run: echo "Enable when a v8.5.8 TiDB checkout is available in CI"
