[workspace]
resolver = "3"
exclude = ["legacy-rust-scaffold", "tools/spikes/tikv-client"]
members = [
    "pkg/parser",
    "pkg/types",
    "pkg/kv",
    "pkg/util",
    "pkg/config",
    "pkg/errno",
    "pkg/meta",
    "pkg/infoschema",
    "pkg/domain",
    "pkg/expression",
    "pkg/planner",
    "pkg/executor",
    "pkg/session",
    "pkg/sessionctx",
    "pkg/sessiontxn",
    "pkg/store",
    "pkg/distsql",
    "pkg/table",
    "pkg/tablecodec",
    "pkg/statistics",
    "pkg/privilege",
    "pkg/bindinfo",
    "pkg/ddl",
    "pkg/server",
    "cmd/tidb-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
authors = ["SealDB Authors"]

[workspace.dependencies]
