[package]
name = "sealdb-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "lib.rs"

[dependencies]
flate2 = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
rustls-pki-types = "1"
sealdb-domain.workspace = true
sealdb-errno.workspace = true
sealdb-executor.workspace = true
sealdb-parser.workspace = true
sealdb-session.workspace = true
sealdb-types.workspace = true
thiserror.workspace = true

[dev-dependencies]
rcgen = "0.13"
